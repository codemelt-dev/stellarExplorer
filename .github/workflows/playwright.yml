name: Explorer and analytics tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests and captured evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint test code
        id: lint
        run: bunx eslint e2e playwright.config.ts playwright.analytics-pools-and-holders.config.ts lib/stellar/analytics-pools-and-holders.test.ts scripts
      - name: Unit tests
        id: unit
        run: bun run test:unit
      - name: Verify captured live analytics evidence
        id: evidence
        shell: bash
        run: |
          mkdir -p test-results/evidence
          bun run test:evidence:analytics-pools-and-holders 2>&1 | tee test-results/evidence/initial-capture.log
          bun run test:evidence:live-analytics 2>&1 | tee test-results/evidence/live-validation.log
      - name: Upload validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: analytics-validation-evidence
          path: |
            test-results/evidence/
            docs/live-analytics-validation.md
            docs/analytics-pools-and-holders-testing.md
            docs/evidence/*.json
            scripts/verify-analytics-pools-and-holders-evidence.mjs
            scripts/verify-live-analytics-evidence.mjs
          retention-days: 30
      - name: Write check summary
        if: ${{ !cancelled() }}
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          UNIT_RESULT: ${{ steps.unit.outcome }}
          EVIDENCE_RESULT: ${{ steps.evidence.outcome }}
        run: |
          node <<'JS'
          const fs = require("node:fs");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## Unit tests and captured evidence",
            "",
            "| Check | Result |",
            "| --- | --- |",
            `| Test-code lint | ${process.env.LINT_RESULT} |`,
            `| Unit tests | ${process.env.UNIT_RESULT} |`,
            `| Saved mainnet evidence | ${process.env.EVIDENCE_RESULT} |`,
            "",
            "The evidence check revalidates the committed capture. It does not query current mainnet data or use production credentials.",
            "Download **analytics-validation-evidence** for the report, public records and verification logs.",
            "",
          ].join("\n"));
          JS

  browser-tests:
    name: Browser tests / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: explorer
            config: playwright.config.ts
            report: playwright-report/
            results: test-results/
            json: test-results/results.json
          - suite: analytics-pools-and-holders
            config: playwright.analytics-pools-and-holders.config.ts
            report: playwright-report/analytics-pools-and-holders/
            results: test-results/analytics-pools-and-holders/
            json: test-results/analytics-pools-and-holders/results.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Build and run browser tests
        id: tests
        run: bunx playwright test --config=${{ matrix.config }}
      - name: Upload report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ matrix.suite }}
          path: |
            ${{ matrix.report }}
            ${{ matrix.results }}
            .e2e-cache/network-errors.log
          include-hidden-files: true
          retention-days: 14
      - name: Write browser summary
        if: ${{ !cancelled() }}
        env:
          TEST_SUITE: ${{ matrix.suite }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          TEST_JSON: ${{ matrix.json }}
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const lines = [
            `## Browser tests: ${process.env.TEST_SUITE}`,
            "",
            `Test step: **${process.env.TEST_RESULT}**`,
            "",
          ];
          if (fs.existsSync(process.env.TEST_JSON)) {
            const { stats } = JSON.parse(fs.readFileSync(process.env.TEST_JSON, "utf8"));
            lines.push(
              "| Passed | Failed | Flaky | Skipped |",
              "| ---: | ---: | ---: | ---: |",
              `| ${stats.expected} | ${stats.unexpected} | ${stats.flaky} | ${stats.skipped} |`,
              "",
            );
          } else {
            lines.push("No browser result was generated. Check the setup/build logs.", "");
          }
          lines.push(
            "Desktop and mobile Chromium run against controlled fixtures. Flaky tests fail CI.",
            `Download **browser-report-${process.env.TEST_SUITE}** for the HTML report and retained failure evidence.`,
            "",
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          JS
